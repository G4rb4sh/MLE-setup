# Neutral brand: the generic default shipped with the plugin. Copy this folder to
# start a new brand; every key below can be changed. No logos, no company data.
name = "neutral"
description = "Generic grey/teal brand with no company identity"
style = "modern"

[colors]
background = "F5F6F7"
surface = "FFFFFF"
primary = "263238"
on_primary = "FFFFFF"
accent = "00897B"
highlight = "4DB6AC"
text = "2B2F33"
muted = "6B7280"
card_border = "DDE1E5"
done = "26A69A"
planned = "F2994A"

[fonts]
body = "Calibri"
heading = "Calibri"
mono = "Consolas"

[grid]
margin = 0.6
columns = 12
gutter = 0.2

[deck]
footer = ""

[docx]
company = ""
